name: plazia-links
x-runtime: &runtime
  image: ${PLZK_IMAGE:?Select the Links runtime image}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3
x-schema: &schema
  <<: *runtime
  entrypoint: [plazia-links]
  restart: "no"
  healthcheck: {disable: true}
  environment:
    PLZK_SCHEMA_DATABASE_URL_FILE: /run/secrets/plzk_schema_database_url
services:
  schema-prepare:
    <<: *schema
    command: [schema-prepare]
  schema-migrate:
    image: ${PLZ_FLYWAY_IMAGE:?Select the catalog Flyway image}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    working_dir: /flyway/project
    environment:
      FLYWAY_CONFIG_FILES: /flyway/project/flyway.toml,/run/secrets/flyway-user.toml
      HOME: /tmp
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes: ["${PLZK_FLYWAY_PROJECT:-../../app/platform/persistence/sql}:/flyway/project:ro"]
    secrets:
      - source: plzk_flyway_user_toml
        target: flyway-user.toml
    command: [migrate]
    depends_on:
      schema-prepare: {condition: service_completed_successfully}
  schema-finish:
    <<: *schema
    command: [schema-finish]
    depends_on:
      schema-migrate: {condition: service_completed_successfully}
  api:
    <<: *runtime
    restart: unless-stopped
    environment:
      PLZK_IDENTITY_ISSUER: ${PLZK_IDENTITY_ISSUER:?Select the Identity issuer}
      PLZK_IDENTITY_AUDIENCE: ${PLZK_IDENTITY_AUDIENCE:?Select the API audience}
      PLZK_IDENTITY_CLIENT_ID: ${PLZK_IDENTITY_CLIENT_ID:?Select the browser client}
      PLZK_IDENTITY_PUBLIC_BASE_URL: ${PLZK_IDENTITY_PUBLIC_BASE_URL:?Select the public origin}
      PLZK_OPENFGA_URL: ${PLZK_OPENFGA_URL:?Select the OpenFGA endpoint}
    depends_on:
      schema-finish: {condition: service_completed_successfully}
  worker:
    <<: *runtime
    restart: unless-stopped
    command: [python, -m, worker.run]
    healthcheck: {disable: true}
    environment:
      PLZK_IDENTITY_PUBLIC_BASE_URL: ${PLZK_IDENTITY_PUBLIC_BASE_URL:?Select the public origin}
    depends_on:
      schema-finish: {condition: service_completed_successfully}
secrets:
  plzk_flyway_user_toml:
    file: ${PLZK_FLYWAY_USER_TOML_FILE:?Select the owner Flyway secret}
