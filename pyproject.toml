[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "worker"]
module-root = ""
source-include = ["app/templates/**", "app/static/**", "app/platform/persistence/sql/**"]

[project]
name = "plazia-links"
version = "0.2.0"
description = "Organization-owned short link pools and activation notifications."
requires-python = ">=3.14,<3.16"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.32", "redis>=5.2,<6",
 "pydantic-settings>=2.6,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.18",
 "httpx>=0.28,<1", "pyjwt[crypto]>=2.15.1,<3", "oauthlib>=3.3.1,<4",
 "dependency-injector>=4.49,<5", "psycopg[binary]>=3.2,<4", "openfga-sdk>=0.10.4,<0.11", "plazia-authz", "plazia-http[fastapi]", "plazia-observability[otel]",
  "plazia-kernel[contacts]", "plazia-contracts",
 "plazia-persistence", "plazia-messaging", "plazia-notifications", "plazia-settings", "plazia-cli",
]

[project.scripts]
plazia-links = "app.cli:main"

[dependency-groups]
dev = [
 "pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8", "pytest-bdd>=8,<9",
 "ruff>=0.15,<1", "mypy>=1.13,<3", "playwright>=1.55,<2", "plazia-tooling",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: requires real infrastructure or a browser"]

[tool.coverage.run]
branch = true
source = ["app", "worker"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.vercel]
entrypoint = "app.index:app"

[tool.uv.sources]
plazia-authlib = { path = "../plazia/packages/plazia-authlib", editable = true }
plazia-authz = { path = "../plazia/packages/plazia-authz", editable = true }
plazia-cli = { path = "../plazia/packages/plazia-cli", editable = true }
plazia-contracts = { path = "../plazia/packages/plazia-contracts", editable = true }
plazia-feature = { path = "../plazia/packages/plazia-feature", editable = true }
plazia-http = { path = "../plazia/packages/plazia-http", editable = true }
plazia-kernel = { path = "../plazia/packages/plazia-kernel", editable = true }
plazia-messaging = { path = "../plazia/packages/plazia-messaging", editable = true }
plazia-notifications = { path = "../plazia/packages/plazia-notifications", editable = true }
plazia-observability = { path = "../plazia/packages/plazia-observability", editable = true }
plazia-persistence = { path = "../plazia/packages/plazia-persistence", editable = true }
plazia-settings = { path = "../plazia/packages/plazia-settings", editable = true }
plazia-tooling = { path = "../plazia/packages/plazia-tooling", editable = true }
