[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["app", "worker"]
source-include = ["migrations/**", "alembic.ini", "infrastructure/**", "tests/**", "docs/**", "uv.lock"]

[project]
name = "plazia-links"
version = "0.1.0.dev0"
description = "Plazia link management service, derived from Zly"
readme = "README.md"
requires-python = ">=3.14,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PythonPlumber", email = "pythonplumber@senuka.me" },
]
keywords = ["url-shortener", "fastapi", "analytics", "qr-code", "link-in-bio", "marketing", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.15.1,<3",
    "oauthlib>=3.3.1,<4",
    "qrcode[pil]>=8.0",
    "email-validator>=2.0.0",
    "sentry-sdk>=2.0.0",
    "aiosmtplib>=3.1.0",
]

[project.scripts]
plazia-links = "app.cli:main"
zly-cli = "app.cli:main"

[project.urls]
Homepage = "https://github.com/salyvinagre/plazia-links"
Repository = "https://github.com/salyvinagre/plazia-links"
Issues = "https://github.com/salyvinagre/plazia-links/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-qrcode>=8.0.0",
    "playwright>=1.55,<2",
]

[project.optional-dependencies]
geo = [
    "geoip2>=5.0.0",
]

[tool.uv]
required-version = ">=0.10.11"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.index:app"

[tool.vercel.scripts]
build = "python -m app.platform.serverless"
