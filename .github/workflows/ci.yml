name: Links quality and acceptance
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plazia-links
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plazia-links
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salyvinagre/plazia
          path: plazia
          token: ${{ secrets.PLZL_SHARED_SOURCE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: make bootstrap check coverage build docs-check actions-check
      - run: make openapi
      - run: make openapi-check CONTAINER=docker
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plazia-links
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plazia-links
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salyvinagre/plazia
          path: plazia
          token: ${{ secrets.PLZL_SHARED_SOURCE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: make bootstrap
      - run: uv run --locked playwright install --with-deps chromium
      - run: make acceptance CONTAINER=docker
      - name: Build the production runtime
        run: make image CONTAINER=docker
      - name: Verify interpreter, user and installed assets
        run: >-
          docker run --rm plazia-links:local python -c
          'import os, sys; from pathlib import Path; import app, app.main, worker.run;
          assert sys.version_info[:2] == (3, 14); assert os.getuid() == 10001;
          root=Path(app.__file__).parent; assert (root/"templates/public/waiting.html").is_file();
          assert (root/"platform/persistence/sql/migrations/V1__link_pools.sql").is_file()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-${{ github.sha }}
          path: plazia-links/output/playwright
          retention-days: 7
