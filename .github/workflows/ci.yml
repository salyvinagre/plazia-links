name: Links quality and acceptance
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plazia-links
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plazia-links
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salyvinagre/plazia
          path: plazia
          token: ${{ secrets.PLZK_SHARED_SOURCE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: make bootstrap check coverage build docs-check actions-check
      - run: make openapi
      - run: make openapi-check CONTAINER=docker
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plazia-links
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plazia-links
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salyvinagre/plazia
          path: plazia
          token: ${{ secrets.PLZK_SHARED_SOURCE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: make bootstrap
      - run: uv run --locked playwright install --with-deps chromium
      - run: make acceptance CONTAINER=docker
      - name: Build the production runtime
        env:
          PLAZIA_CONTAINER_BUILDER: docker
        run: make image image-smoke CONTAINER=docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-${{ github.sha }}
          path: plazia-links/output/playwright
          retention-days: 7
