name: Validate Identity integration
on:
  push:
    branches: [feat/identity-core-link-flow]
    paths: [.github/workflows/identity-apply.yml]
permissions:
  contents: write
jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plazia_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: plazia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plazia_test -d plazia_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-test-secret-not-for-production-0001
      JWT_SECRET: ci-only-test-secret-not-for-production-0002
      RATE_LIMIT_ENABLED: 'false'
      UV_PYTHON: '3.14'
      REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv python install 3.14
      - name: Apply checksum-verified source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.github/identity-patch-{i}.b64').read_text() for i in range(5)]
          # Correct the single verified text-transfer insertion before integrity validation.
          assert parts[1].count('PICNBtssWgfGG6n9') == 1
          parts[1] = parts[1].replace('PICNBtssWgfGG6n9', 'PICNBtssWgfG6n9', 1)
          data = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '14a1125f64b04dec0c9ebdd1f172a62eb60b7f9342c71a7f084b63524c95d713'
          subprocess.run(['git', 'apply', '--index', '-'], input=lzma.decompress(data), check=True)
          for name in ('identity-fixes.patch', 'identity-fixture-fix.patch'):
              path = pathlib.Path('.github', name)
              subprocess.run(['git', 'apply', '--index', str(path)], check=True)
              path.unlink()
          for path in pathlib.Path('.github').glob('identity-patch-*.b64'):
              path.unlink()
          for name in ('identity-apply.yml', 'identity-review.yml'):
              pathlib.Path('.github/workflows', name).unlink(missing_ok=True)
          PY
      - name: Resolve and lock new dependencies
        run: |
          uv lock
          uv sync --locked --all-extras
      - name: Quality gates
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy app/ worker/
          git diff --check
      - name: PostgreSQL 18 migrations and application tests
        env:
          DATABASE_URL: postgresql+asyncpg://plazia_test:local-ci-only@localhost:5432/plazia_test
          POSTGRES_TEST_URL: postgresql+asyncpg://plazia_test:local-ci-only@localhost:5432/plazia_test
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv run --locked pytest -q tests/test_postgres_runtime.py --junitxml="$RUNNER_TEMP/postgres.xml"
      - name: Real Chromium, PostgreSQL and Redis acceptance
        env:
          DATABASE_URL: postgresql+asyncpg://plazia_test:local-ci-only@localhost:5432/plazia_test
          POSTGRES_TEST_URL: postgresql+asyncpg://plazia_test:local-ci-only@localhost:5432/plazia_test
          IDENTITY_E2E: '1'
        run: |
          uv run --locked playwright install --with-deps chromium
          uv run --locked pytest -q tests/e2e --junitxml="$RUNNER_TEMP/browser.xml"
      - name: Complete unit, API and acceptance suite
        run: uv run --locked pytest -q --junitxml="$RUNNER_TEMP/unit.xml"
      - name: Packaging and production image
        run: |
          uv build --no-sources
          docker build -f infrastructure/Dockerfile -t plazia-links:identity-ci .
          docker run --rm plazia-links:identity-ci python -c 'import os, sys; from pathlib import Path; assert sys.version_info[:2] == (3,14); assert os.getuid() != 0; assert Path("app/templates/identity/links.html").exists(); import app.main; import worker.run'
      - name: Store verified Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, json, os, pathlib, subprocess, tarfile, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          subprocess.run(['git', 'add', '-A'], check=True)
          base_tree = git('rev-parse', 'HEAD^{tree}')
          expected = git('write-tree')
          paths = subprocess.check_output(['git','diff','--cached','--no-renames','--name-only','-z','HEAD']).decode().strip('\0').split('\0')
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/'
          def post(path, payload):
              request = urllib.request.Request(api + path, data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def entry(name):
              path = pathlib.Path(name)
              if not path.exists():
                  return {'path':name, 'mode':'100644', 'type':'blob', 'sha':None}
              mode = git('ls-files','--stage','--',name).split()[0]
              content = path.read_bytes()
              sha = post('blobs', {'encoding':'base64', 'content':base64.b64encode(content).decode()})['sha']
              assert sha == git('hash-object',name), name
              return {'path':name,'mode':mode,'type':'blob','sha':sha}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              entries = list(pool.map(entry, paths))
          result = post('trees', {'base_tree':base_tree, 'tree':entries})
          assert result['sha'] == expected, (result['sha'], expected)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'identity-validated'
          out.mkdir(exist_ok=True)
          (out/'result.json').write_text(json.dumps({'base_commit':git('rev-parse','HEAD'), 'tree':expected, 'files_changed':len(paths)}, indent=2))
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')
          with tarfile.open(out/'source.tar.gz', 'w:gz') as archive:
              for name in tracked:
                  archive.add(name, arcname=name, recursive=False)
          print('Verified source tree:', expected)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: identity-validation-result
          path: |
            ${{ runner.temp }}/identity-validated/
            ${{ runner.temp }}/unit.xml
            ${{ runner.temp }}/postgres.xml
            ${{ runner.temp }}/browser.xml
          retention-days: 3
          if-no-files-found: warn
