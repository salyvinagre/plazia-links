name: Identity review inputs
on:
  push:
    branches: [feat/identity-core-link-flow]
    paths: [.github/workflows/identity-review.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.21'
      - run: uv python install 3.14
      - name: Capture source and additional validation dependencies
        run: |
          mkdir -p review
          git archive --format=tar HEAD > review/source.tar
          uv pip install --python 3.14 --target review/deps 'Authlib==1.7.2' 'PyJWT[crypto]>=2.15.1,<3' 'playwright>=1.55,<2' 'pytest-playwright>=0.7,<1'
          tar -czf review/deps.tar.gz -C review/deps .
          rm -rf review/deps
      - uses: actions/upload-artifact@v4
        with:
          name: identity-review-inputs
          path: review/
          retention-days: 1
