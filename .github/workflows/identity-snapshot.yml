name: Identity source snapshot
on:
  push:
    branches: [feat/identity-core-link-flow]
    paths: [.github/workflows/identity-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.21'
      - run: uv python install 3.14
      - name: Restore reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.github/identity-patch-{i}.b64').read_text() for i in range(5)]
          assert parts[1].count('PICNBtssWgfGG6n9') == 1
          parts[1] = parts[1].replace('PICNBtssWgfGG6n9', 'PICNBtssWgfG6n9', 1)
          data = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '14a1125f64b04dec0c9ebdd1f172a62eb60b7f9342c71a7f084b63524c95d713'
          subprocess.run(['git','apply','--index','-'],input=lzma.decompress(data),check=True)
          for name in ('identity-fixes.patch','identity-fixture-fix.patch','identity-finalize.patch'):
              path = pathlib.Path('.github',name)
              patch = path.read_text().replace('\n diff --git ', '\ndiff --git ')
              subprocess.run(['git','apply','--index','-'],input=patch.encode(),check=True)
              path.unlink()
          for path in pathlib.Path('.github').glob('identity-patch-*.b64'):
              path.unlink()
          for name in ('identity-apply.yml','identity-review.yml','identity-snapshot.yml'):
              pathlib.Path('.github/workflows',name).unlink(missing_ok=True)
          PY
          uv lock
          uv sync --locked --all-extras
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy app/ worker/
          git add -A
          test "$(git write-tree)" = d11db857da00b70cef1f8d15e3cfcb27b7a26199
      - name: Store reviewed Git objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          expected = git('write-tree')
          api = 'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'
          def post(path, payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          paths=subprocess.check_output(['git','diff','--cached','--no-renames','--name-only','-z','HEAD']).decode().strip('\0').split('\0')
          def entry(name):
              path=pathlib.Path(name)
              if not path.exists():
                  return {'path':name,'mode':'100644','type':'blob','sha':None}
              sha=post('blobs',{'encoding':'base64','content':base64.b64encode(path.read_bytes()).decode()})['sha']
              assert sha==git('hash-object',name)
              return {'path':name,'mode':git('ls-files','--stage','--',name).split()[0],'type':'blob','sha':sha}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries=list(pool.map(entry,paths))
          result=post('trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          assert result['sha']==expected
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'identity-snapshot'
          out.mkdir(exist_ok=True)
          (out/'result.json').write_text(json.dumps({'base_commit':git('rev-parse','HEAD'),'tree':expected,'files_changed':len(paths)},indent=2))
          print('Verified source tree:',expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: identity-source-staged
          path: ${{ runner.temp }}/identity-snapshot/
          retention-days: 1
