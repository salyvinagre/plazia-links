name: Python 3.14 review environment
on:
  push:
    branches: ['chore/stabilize-zly-baseline']
    paths: ['.github/workflows/python314-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.21'
      - name: Prepare target project metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pyproject.toml')
          s = p.read_text()
          s = s.replace('requires = ["setuptools>=69.0"]\nbuild-backend = "setuptools.build_meta"\n\n[tool.setuptools.packages.find]\nwhere = ["."]\ninclude = ["app*", "worker*"]', 'requires = ["uv_build>=0.12.21,<0.13"]\nbuild-backend = "uv_build"\n\n[tool.uv.build-backend]\nmodule-root = ""\nmodule-name = ["app", "worker"]\nsource-include = ["migrations/**", "alembic.ini", "infrastructure/**", "tests/**"]')
          s = s.replace('requires-python = ">=3.12"', 'requires-python = ">=3.14"')
          s = s.replace('"Programming Language :: Python :: 3.12",\n    "Programming Language :: Python :: 3.13",', '"Programming Language :: Python :: 3.14",')
          s = s.replace('[project.optional-dependencies]\ndev = [', '[dependency-groups]\ndev = [')
          s = s.replace('    "mypy>=1.13.0",', '    "mypy>=1.13.0",\n    "types-qrcode>=8.0.0",')
          s = s.replace(']\ngeo = [', ']\n\n[project.optional-dependencies]\ngeo = [')
          s = s.replace('target-version = "py312"', 'target-version = "py314"').replace('python_version = "3.12"', 'python_version = "3.14"')
          p.write_text(s)
          Path('.python-version').write_text('3.14\n')
          PY
          uv python install 3.14
          uv lock
          uv sync --locked --all-extras
      - name: Capture isolated toolchain for offline reproduction
        run: |
          mkdir -p review
          cp pyproject.toml uv.lock review/
          cp "$(command -v uv)" review/uv
          uv run --no-sync python --version > review/versions.txt
          uv --version >> review/versions.txt
          PYTHON_ROOT="$(uv run --no-sync python -c 'import sys; print(sys.base_prefix)')"
          tar -czf review/python314.tar.gz -C "$PYTHON_ROOT" .
          tar -czf review/site-packages.tar.gz -C .venv/lib/python3.14/site-packages .
          tar -czf review/uv-cache.tar.gz -C "$(uv cache dir)" .
      - uses: actions/upload-artifact@v4
        with:
          name: python314-review-environment
          path: review/
          retention-days: 1
