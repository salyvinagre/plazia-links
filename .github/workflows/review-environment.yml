name: Baseline review environment
on:
  push:
    branches: [chore/stabilize-zly-baseline]
    paths: [.github/workflows/review-environment.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip download --only-binary=:all: --dest wheels
          ruff aiosqlite arq redis asyncpg bcrypt aiosmtplib mypy
      - uses: actions/upload-artifact@v4
        with:
          name: offline-review-dependencies
          path: wheels/
          retention-days: 1
