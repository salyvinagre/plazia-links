name: plazia-links
x-runtime: &runtime
  image: ${PLZL_IMAGE:-plazia-links:local}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: ["${PLZL_CONFIG_PATH:?Set config path}:/etc/plzl/config.toml:ro"]
services:
  api:
    <<: *runtime
    ports: ['127.0.0.1:8000:8000']
    environment:
      PLZL_ENVIRONMENT: production
      PLZL_CONFIG_FILE: /etc/plzl/config.toml
      PLZL_DATABASE_URL_FILE: /run/secrets/database_url
      PLZL_REDIS_URL_FILE: /run/secrets/redis_url
      PLZL_IDENTITY_CLIENT_SECRET_FILE: /run/secrets/identity_client_secret
    secrets:
      - source: app_database_url
        target: database_url
      - source: redis_url
        target: redis_url
      - source: identity_client_secret
        target: identity_client_secret
  worker:
    <<: *runtime
    command: [python, -m, worker.run]
    healthcheck:
      disable: true
    environment:
      PLZL_ENVIRONMENT: production
      PLZL_CONFIG_FILE: /etc/plzl/config.toml
      PLZL_WORKER_DATABASE_URL_FILE: /run/secrets/database_url
      PLZL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - source: worker_database_url
        target: database_url
      - source: smtp_password
        target: smtp_password
secrets:
  app_database_url:
    file: ${PLZL_APP_DATABASE_URL_PATH:?Set API credential file}
  worker_database_url:
    file: ${PLZL_WORKER_DATABASE_URL_PATH:?Set worker credential file}
  redis_url:
    file: ${PLZL_REDIS_URL_PATH:?Set Redis credential file}
  identity_client_secret:
    file: ${PLZL_IDENTITY_CLIENT_SECRET_PATH:?Set Identity credential file}
  smtp_password:
    file: ${PLZL_SMTP_PASSWORD_PATH:?Set SMTP credential file}
