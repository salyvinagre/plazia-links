name: plazia-links

x-runtime: &runtime
  image: plazia-links:local
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  env_file:
    - ../.env
  environment:
    ENVIRONMENT: production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plazia_links}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plazia_links}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *runtime
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  fastapi:
    <<: *runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *runtime
    command: [arq, worker.run.WorkerSettings]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, arq, --check, worker.run.WorkerSettings]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
