{% extends "identity/base.html" %}
{% block content %}<section class="editor"><a href="/dashboard/links">← All links</a><h1>{{ 'Edit link' if link_id else 'Create link' }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/dashboard/links{% if link_id %}/{{ link_id }}{% endif %}">
<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
<label for="destination">Destination URL</label><input id="destination" name="destination_url" type="url" value="{{ values.destination_url or '' }}" maxlength="8192" required placeholder="https://example.com/page">
<label for="title">Title <span>(optional)</span></label><input id="title" name="title" value="{{ values.title or '' }}" maxlength="200">
{% if not link_id %}<label for="code">Short code <span>(optional)</span></label><input id="code" name="short_code" value="{{ values.short_code or '' }}" minlength="3" maxlength="10" pattern="[A-Za-z0-9_-]+" placeholder="Generated automatically"><p class="hint">3–10 letters, numbers, underscores or hyphens.</p>{% endif %}
<label for="notes">Internal notes <span>(optional)</span></label><textarea id="notes" name="notes" maxlength="4000" rows="3">{{ values.notes or '' }}</textarea>
{% if link_id %}<label class="checkbox"><input name="is_active" type="checkbox" {% if values.is_active %}checked{% endif %}> Active</label>{% endif %}
<div class="form-actions"><button type="submit">{{ 'Save changes' if link_id else 'Create link' }}</button><a href="/dashboard/links">Cancel</a></div></form></section>{% endblock %}
